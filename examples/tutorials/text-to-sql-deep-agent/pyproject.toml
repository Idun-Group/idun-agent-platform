[project]
name = "idun-tutorial-text-to-sql-deep-agent"
version = "0.1.0"
description = "Natural-language to SQL agent based on the LangChain Deep Agents text-to-sql example, served by Idun Engine. Plans, explores schema, writes safe SELECT queries over the Chinook sample database."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "idun-agent-engine>=0.6.2",
    "deepagents>=0.3.5",
    "langchain>=1.2.3",
    "langchain-anthropic>=1.3.1",
    "langchain-community>=0.3.0",
    "langchain-google-genai>=2.0",
    "langgraph>=1.0.6",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
