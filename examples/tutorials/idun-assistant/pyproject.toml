[project]
name = "idun-tutorial-langgraph-copilot"
version = "0.1.0"
description = "LangGraph dev copilot on Idun Engine. Wires four MCP servers (idun-docs, Atlassian, GitHub, Google Workspace), a managed system prompt, Google Chat integration, and Langfuse observability."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "idun-agent-engine>=0.6.2",
    "langgraph>=1.0",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3"]
openai = ["langchain-openai>=0.2"]

[tool.uv]
package = false
