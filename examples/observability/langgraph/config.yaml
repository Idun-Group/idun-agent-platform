server:
  api:
    port: 8000

agent:
  type: LANGGRAPH
  config:
    name: "observability-langgraph"
    graph_definition: "./agent.py:graph"
    checkpointer:
      type: sqlite
      db_url: "sqlite:///conversations.db"

observability:
  - provider: LANGFUSE
    enabled: true
    config:
      host: LANGFUSE_HOST
      public_key: LANGFUSE_PUBLIC_KEY
      secret_key: LANGFUSE_SECRET_KEY
      run_name: "observability-langgraph"
