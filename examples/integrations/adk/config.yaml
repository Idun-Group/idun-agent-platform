server:
  api:
    port: 8000

agent:
  type: ADK
  config:
    name: "integrations-adk"
    agent: "./agent.py:root_agent"
    app_name: "integrations_adk"

# Slack Events API integration. Same integrations block as the LangGraph
# variant; only agent.type and the agent code differ. Other providers:
# DISCORD, GOOGLE_CHAT, TEAMS, WHATSAPP.
integrations:
  - provider: SLACK
    enabled: true
    config:
      bot_token: SLACK_BOT_TOKEN
      signing_secret: SLACK_SIGNING_SECRET
