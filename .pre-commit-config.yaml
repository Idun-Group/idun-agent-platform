repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-added-large-files
        name: "📏 files · Check for large files"
        # LiteLLM model_prices_and_context_window.json is a ~1.4 MB vendored
        # snapshot used by the standalone trace-cost calculator (see
        # tasks/trace-feature-08-05-2026/06-cost-token-capture.md). Refreshed
        # monthly via Dependabot-style chore PR.
        exclude: ^(.*/)?(node_modules|\.venv|venv|build|dist|\.git|\.ruff_cache|__pycache__)/|(^|/)libs/idun_agent_standalone/src/idun_agent_standalone/infrastructure/traces/data/litellm_prices\.json$
    -   id: check-ast
        name: "🐍 syntax · Check Python AST"
        exclude: ^(.*/)?(node_modules|\.venv|venv|build|dist|\.git|\.ruff_cache|__pycache__)/
    -   id: check-json
        name: "📋 format · Check JSON syntax"
        # Note: VSCode launch configs and TS configs are JSONC (allow comments/trailing commas).
        # LiteLLM prices snapshot has occasional upstream duplicate keys
        # (e.g. zai.glm-5); Python json.loads accepts duplicates (last wins),
        # but the strict pre-commit JSON check does not. The snapshot is a
        # verbatim vendored mirror of an upstream file — refresh PRs surface
        # malformed snapshots via the unit tests in test_costs.py.
        exclude: (^|/)(node_modules|\.venv|venv|build|dist|\.git|\.ruff_cache|__pycache__)(/|$)|(^|/)package-lock\.json$|(^|/)\.vscode/launch\.json$|(^|/)services/idun_agent_web/tsconfig\.(app|node)\.json$|(^|/)libs/idun_agent_standalone/src/idun_agent_standalone/infrastructure/traces/data/litellm_prices\.json$
    -   id: check-merge-conflict
        name: "🔀 merge · Check for merge conflicts"
        exclude: ^(.*/)?(node_modules|\.venv|venv|build|dist|\.git|\.ruff_cache|__pycache__)/
    -   id: check-yaml
        name: "📄 format · Check YAML syntax"
        # mkdocs.yml can include PyYAML-specific tags (e.g. !!python/name:...)
        exclude: (^|/)(node_modules|\.venv|venv|build|dist|\.git|\.ruff_cache|__pycache__)(/|$)|(^|/)mkdocs\.yml$
    -   id: end-of-file-fixer
        name: "📝 format · Fix end of files"
        exclude: ^(.*/)?(node_modules|\.venv|venv|build|dist|\.git|\.ruff_cache|__pycache__)/
    -   id: trailing-whitespace
        name: "✂️ format · Trim trailing whitespace"
        exclude: ^(.*/)?(node_modules|\.venv|venv|build|dist|\.git|\.ruff_cache|__pycache__)/
    -   id: detect-private-key
        name: "🔑 security · Detect private keys"
        # PostHog "project API key" (public) is embedded for telemetry; don't flag it as a private key.
        exclude: (^|/)(node_modules|\.venv|venv|build|dist|\.git|\.ruff_cache|__pycache__)(/|$)|(^|/)libs/idun_agent_engine/src/idun_agent_engine/telemetry/telemetry\.py$
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.9
    hooks:
    -   id: ruff
        name: "⚡ lint · Ruff linter and formatter"
        args:
        - --fix
        - --no-cache
        exclude: ^(.*/)?(node_modules|\.venv|venv|build|dist|\.git|\.ruff_cache|__pycache__|libs/idun_agent_engine/examples|bruno)/
-   repo: local
    hooks:
    -   id: pyright
        name: "🔍 types · Pyright static type checker"
        entry: uv run pyright
        language: system
        stages: [manual]
        types: [python]
        args:
        - --project
        - pyrightconfig.json
        exclude: ^(.*/)?(node_modules|\.venv|venv|build|dist|\.git|\.ruff_cache|__pycache__|libs/idun_agent_engine/examples)/
-   repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
    -   id: gitleaks
        name: "🔒 security · Detect hardcoded secrets"
        exclude: (^|/)(node_modules|\.venv|venv|build|dist|\.git|\.ruff_cache|__pycache__)(/|$)|(^|/)libs/idun_agent_engine/src/idun_agent_engine/telemetry/telemetry\.py$
-   repo: local
    hooks:
    -   id: commitlint-advisory
        name: "📝 commits · commitlint (advisory)"
        # Advisory only — `|| true` masks the exit code so non-Conventional
        # commits still go through. `verbose: true` makes commitlint findings
        # visible even when the hook reports "Passed". Graduates to a blocking
        # hook in Phase 2 by removing `|| true`.
        entry: bash -c 'npx --yes @commitlint/cli@19 --edit "$1" || true' --
        language: system
        stages: [commit-msg]
        pass_filenames: false
        verbose: true
default_stages: [commit]
