name: Standalone CI

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "libs/idun_agent_standalone/**"
      - "libs/idun_agent_engine/**"
      - "libs/idun_agent_schema/**"
      - "services/idun_agent_standalone_ui/**"
      - ".github/workflows/standalone-ci.yml"
  push:
    branches: [main, develop]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "libs/idun_agent_standalone/**"
      - "libs/idun_agent_engine/**"
      - "libs/idun_agent_schema/**"
      - "services/idun_agent_standalone_ui/**"
      - ".github/workflows/standalone-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: idun
          POSTGRES_PASSWORD: idun
          POSTGRES_DB: idun_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idun"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir uv
      - run: uv sync --all-groups
      - run: uv run pytest libs/idun_agent_standalone/tests -q
        env:
          STANDALONE_TEST_POSTGRES_URL: postgresql+asyncpg://idun:idun@localhost:5432/idun_test
      - run: uv run pytest libs/idun_agent_engine/tests/integration/server libs/idun_agent_engine/tests/unit/agent/test_observers.py -q

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/idun_agent_standalone_ui
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: services/idun_agent_standalone_ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: services/idun_agent_standalone_ui/pnpm-lock.yaml
      - name: Build standalone image
        run: |
          docker build \
            -f docker/Dockerfile.base \
            -t standalone:ci \
            .
      - name: Boot image and hit /admin/api/v1/health
        run: |
          mkdir -p /tmp/standalone-smoke
          cat > /tmp/standalone-smoke/config.yaml <<'EOF'
          agent:
            type: LANGGRAPH
            config:
              name: CI Smoke
              graph_definition: idun_agent_standalone.testing:echo_graph
              checkpointer:
                type: memory
          EOF
          HASH=$(docker run --rm --entrypoint idun standalone:ci hash-password --password ci-smoke-pass | tail -1)
          SECRET=$(openssl rand -hex 32)
          docker run --rm -d --name standalone-smoke -p 8000:8000 \
            -v /tmp/standalone-smoke:/app/agent:ro \
            -e IDUN_ADMIN_AUTH_MODE=password \
            -e IDUN_ADMIN_PASSWORD_HASH="$HASH" \
            -e IDUN_SESSION_SECRET="$SECRET" \
            standalone:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo
              echo "health ok after ${i}s"
              docker stop standalone-smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "health check failed; container logs:"
          docker logs standalone-smoke
          docker stop standalone-smoke >/dev/null || true
          exit 1

  wheel-install-smoke:
    name: Wheel install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir uv
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: services/idun_agent_standalone_ui/pnpm-lock.yaml
      - name: Install pnpm deps
        run: cd services/idun_agent_standalone_ui && pnpm install --frozen-lockfile
      - name: Run smoke
        run: scripts/wheel-install-smoke.sh

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      # Required by tests/e2e/admin-edit-and-reload.spec.ts: the spec adds a
      # BAN_LIST guardrail via admin REST, which the engine's reload pipeline
      # converts via convert_guardrail() — that call requires GUARDRAILS_API_KEY.
      # Without this env wiring the spec auto-skips (test.skip guard) and the
      # admin-REST → reload coverage doesn't fire here. Repo secret is set
      # under the same name; fork PRs that can't access secrets fall back to
      # the test.skip guard.
      GUARDRAILS_API_KEY: ${{ secrets.GUARDRAILS_API_KEY }}
    defaults:
      run:
        working-directory: services/idun_agent_standalone_ui
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir uv
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: services/idun_agent_standalone_ui/pnpm-lock.yaml
      - name: Sync workspace deps
        working-directory: ${{ github.workspace }}
        run: uv sync --all-groups
      - name: Install pnpm deps
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E (Playwright webServer boots its own backend)
        run: pnpm test:e2e
