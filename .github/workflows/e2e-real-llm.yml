name: E2E (real LLM)

on:
  pull_request:
    branches: [main, develop]

# Cancel in-flight runs on the same PR when a new commit lands.
concurrency:
  group: e2e-real-llm-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Check secrets availability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_secrets: ${{ steps.check.outputs.has_secrets }}
    steps:
      - id: check
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GUARDRAILS_API_KEY: ${{ secrets.GUARDRAILS_API_KEY }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          missing=()
          [[ -z "$OPENAI_API_KEY" ]] && missing+=("OPENAI_API_KEY")
          [[ -z "$GOOGLE_API_KEY" && -z "$GEMINI_API_KEY" ]] && missing+=("GOOGLE_API_KEY|GEMINI_API_KEY")
          [[ -z "$GUARDRAILS_API_KEY" ]] && missing+=("GUARDRAILS_API_KEY")

          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Secrets missing. Auto-skip only on fork PRs (where secrets are
          # genuinely unavailable). Internal PRs missing secrets are a
          # configuration bug — fail loudly.
          echo "has_secrets=false" >> $GITHUB_OUTPUT
          if [[ "$IS_FORK" == "true" ]]; then
            echo "::notice::Skipping e2e-real-llm: secrets unavailable on fork PR. Missing: ${missing[*]}"
            exit 0
          else
            echo "::error::Internal PR missing required e2e secrets: ${missing[*]}. Fix repo secrets configuration."
            exit 1
          fi

  pytest-matrix:
    name: pytest e2e — ${{ matrix.pair }}
    needs: preflight
    if: needs.preflight.outputs.has_secrets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pair:
          - lg-openai
          - lg-gemini
          - adk-gemini
    env:
      E2E_PAIR: ${{ matrix.pair }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GUARDRAILS_API_KEY: ${{ secrets.GUARDRAILS_API_KEY }}
      IDUN_TELEMETRY_ENABLED: "false"
      # Force AI Studio auth (bypasses any host Vertex env that might
      # leak through — defense in depth; CI runner shouldn't have it,
      # but matches the conftest's explicit override).
      GOOGLE_GENAI_USE_VERTEXAI: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install workspace dependencies
        # ``--all-extras`` pulls in the engine's ``[guardrails]`` optional
        # extra so the ``guardrails`` CLI is available for the
        # pre-install step below. The extra became opt-in once PyPI
        # quarantined ``guardrails-ai`` (see #642 / #643); e2e jobs are
        # the one place we want it installed.
        run: uv sync --group dev --all-extras

      - name: Pre-install Guardrails Hub validators
        # Bootstraps ~/.guardrailsrc (the CLI's auth file) and eagerly
        # downloads BanList + DetectPII validators along with their
        # transitive deps (presidio-analyzer + a spaCy model for
        # DetectPII). Without this step, the engine's _install_model
        # path runs at boot/reload, and DetectPII's post-install hook
        # silently fails on the runner (no spaCy model preinstalled),
        # leaving the guard inactive — the exact silent-passthrough
        # behavior PR #595 made loud. Pre-installing here turns
        # _install_model into a fast no-op and makes the matrix
        # non-flaky for guardrail scenarios.
        run: |
          uv run guardrails configure \
            --token "$GUARDRAILS_API_KEY" \
            --disable-remote-inferencing \
            --disable-metrics
          uv run guardrails hub install hub://guardrails/ban_list
          uv run guardrails hub install hub://guardrails/detect_pii

      - name: Run pytest e2e for matrix pair
        run: uv run pytest tests/e2e/ -v --pair=${{ matrix.pair }} --maxfail=3

  playwright:
    name: Playwright e2e (real LLM)
    needs: preflight
    if: needs.preflight.outputs.has_secrets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-5.4-mini
      IDUN_TELEMETRY_ENABLED: "false"
      GOOGLE_GENAI_USE_VERTEXAI: "false"
      # Admin REST guardrail-add scenario also needs Guardrails Hub.
      GUARDRAILS_API_KEY: ${{ secrets.GUARDRAILS_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install workspace dependencies
        # ``--all-extras`` pulls in the engine's ``[guardrails]`` optional
        # extra so the ``guardrails`` CLI is available for the
        # pre-install step below. The extra became opt-in once PyPI
        # quarantined ``guardrails-ai`` (see #642 / #643); e2e jobs are
        # the one place we want it installed.
        run: uv sync --group dev --all-extras

      - name: Pre-install Guardrails Hub validators
        # admin-edit-and-reload.spec.ts adds a BAN_LIST guardrail via
        # admin REST and asserts the reload-then-block. Same rationale
        # as the pytest-matrix step above: bootstrap ~/.guardrailsrc and
        # cache validator deps so the standalone subprocess's reload
        # pipeline doesn't hit a slow/flaky Hub install during the test.
        run: |
          uv run guardrails configure \
            --token "$GUARDRAILS_API_KEY" \
            --disable-remote-inferencing \
            --disable-metrics
          uv run guardrails hub install hub://guardrails/ban_list

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 9

      - name: Install UI dependencies
        working-directory: services/idun_agent_standalone_ui
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: services/idun_agent_standalone_ui
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright real-LLM specs
        working-directory: services/idun_agent_standalone_ui
        run: pnpm exec playwright test e2e/chat-real-llm.spec.ts e2e/admin-edit-and-reload.spec.ts

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces-${{ github.run_id }}
          path: services/idun_agent_standalone_ui/test-results/
          retention-days: 7
