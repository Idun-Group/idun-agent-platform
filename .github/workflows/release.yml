name: Release Idun Agent Platform

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.6.0). Required for manual dispatch."
        required: true
        type: string

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ============================================================================
  # Job 1: Publish Schema to PyPI
  # ============================================================================
  publish-schema:
    name: Publish Schema to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # For trusted publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Extract version from tag
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            RAW_REF="${{ inputs.tag }}"
          else
            RAW_REF="${GITHUB_REF_NAME:-${GITHUB_REF#refs/tags/}}"
          fi
          VERSION=${RAW_REF#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      # - name: Update version in pyproject.toml
      #   working-directory: libs/idun_agent_schema
      #   run: |
      #     sed -i 's/version = ".*"/version = "${{ steps.version.outputs.VERSION }}"/' pyproject.toml
      #     cat pyproject.toml | grep version

      - name: Build schema package
        working-directory: libs/idun_agent_schema
        run: |
          uv build --wheel --sdist --out-dir dist
          ls -lh dist/

      - name: Check distribution metadata
        run: uvx twine check libs/idun_agent_schema/dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: libs/idun_agent_schema/dist/
          verbose: true
          skip-existing: true

  # ============================================================================
  # Job 2: Publish Engine to PyPI (depends on schema)
  # ============================================================================
  publish-engine:
    name: Publish Engine to PyPI
    runs-on: ubuntu-latest
    needs: publish-schema
    permissions:
      contents: read
      id-token: write # For trusted publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: services/idun_agent_standalone_ui/pnpm-lock.yaml

      - name: Extract version from tag
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            RAW_REF="${{ inputs.tag }}"
          else
            RAW_REF="${GITHUB_REF_NAME:-${GITHUB_REF#refs/tags/}}"
          fi
          VERSION=${RAW_REF#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Update engine version and pin schema dependency
        working-directory: libs/idun_agent_engine
        run: |
          sed -i 's/version = ".*"/version = "${{ steps.version.outputs.VERSION }}"/' pyproject.toml
          sed -i 's|"idun-agent-schema>=.*"|"idun-agent-schema==${{ steps.version.outputs.VERSION }}"|' pyproject.toml
          echo "Updated pyproject.toml:"
          grep -m 1 'version = ' pyproject.toml
          grep 'idun-agent-schema' pyproject.toml
          grep -q '^version = "${{ steps.version.outputs.VERSION }}"$' pyproject.toml || (echo "::error::Engine version sed did not produce expected pin"; exit 1)
          grep -q '"idun-agent-schema==${{ steps.version.outputs.VERSION }}"' pyproject.toml || (echo "::error::Schema dep sed did not produce expected pin"; exit 1)

      - name: Wait for schema to be available on PyPI
        run: |
          echo "Waiting for schema ${{ steps.version.outputs.VERSION }} to be available on PyPI..."
          MAX_ATTEMPTS=24
          ATTEMPT=1
          SLEEP_DURATION=5

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Looking for schema ${{ steps.version.outputs.VERSION }}..."

            if pip index versions idun-agent-schema 2>/dev/null | grep -q "^idun-agent-schema (${{ steps.version.outputs.VERSION }})"; then
              echo "✓ Schema ${{ steps.version.outputs.VERSION }} found on PyPI"
              exit 0
            fi

            echo "Not yet available. Waiting ${SLEEP_DURATION}s..."
            sleep $SLEEP_DURATION
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "::error::Could not find schema ${{ steps.version.outputs.VERSION }} on PyPI after ${MAX_ATTEMPTS} attempts (${MAX_ATTEMPTS} × ${SLEEP_DURATION}s = $((MAX_ATTEMPTS * SLEEP_DURATION))s)"
          exit 1

      - name: Build standalone UI
        run: make build-standalone-ui

      - name: Build engine package
        working-directory: libs/idun_agent_engine
        run: |
          uv build --no-sources --wheel --sdist --out-dir dist
          ls -lh dist/

      - name: Check distribution metadata
        run: uvx twine check libs/idun_agent_engine/dist/*

      - name: Smoke test built engine wheel
        run: |
          python -m venv /tmp/engine-prepub-venv
          source /tmp/engine-prepub-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install libs/idun_agent_engine/dist/*.whl
          python -c "import idun_agent_engine, idun_agent_standalone, idun_agent_schema"
          python -c "from importlib.resources import files; assert (files('idun_agent_standalone') / 'alembic.ini').is_file(); assert (files('idun_agent_standalone') / 'static' / 'index.html').is_file()"
          idun --help
          idun agent serve --help
          idun init --help
          idun setup --help
          idun hash-password --help

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: libs/idun_agent_engine/dist/
          verbose: true
          skip-existing: true

  # ============================================================================
  # Job 3: Create Release Summary
  # ============================================================================
  release-summary:
    name: Create Release Summary
    runs-on: ubuntu-latest
    needs: [publish-schema, publish-engine]
    if: success()

    steps:
      - name: Extract version from tag
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            RAW_REF="${{ inputs.tag }}"
          else
            RAW_REF="${GITHUB_REF_NAME:-${GITHUB_REF#refs/tags/}}"
          fi
          VERSION=${RAW_REF#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create summary
        run: |
          echo "# 🚀 Idun Agent Platform Release ${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📦 Install" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "pip install idun-agent-engine==${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Includes the engine runtime, the standalone admin REST API, the bundled UI, and the \`idun\` CLI. The published \`idun-agent-schema\` package is pulled in as a transitive dependency." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔗 Components published" >> $GITHUB_STEP_SUMMARY
          echo "- [idun-agent-engine](https://pypi.org/project/idun-agent-engine/${{ steps.version.outputs.VERSION }}/)" >> $GITHUB_STEP_SUMMARY
          echo "- [idun-agent-schema](https://pypi.org/project/idun-agent-schema/${{ steps.version.outputs.VERSION }}/)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Release Complete!" >> $GITHUB_STEP_SUMMARY
