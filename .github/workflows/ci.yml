name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint, type-check, and secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run pre-commit via uv
        env:
          RUFF_CACHE_DIR: ${{ github.workspace }}/.ruff_cache
          PYRIGHT_PYTHON_FORCE_VERSION: latest
        run: |
          uv run pre-commit run --all-files

  test-engine:
    name: Test engine (Py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false

      - name: Install workspace dependencies
        # --all-extras pulls in idun-agent-engine's opt-in [guardrails] extra
        # (guardrails-ai + the `guardrails` CLI) so the guardrails tests run for
        # real instead of erroring on a missing CLI. guardrails is the only
        # extra in the workspace, so this stays lean. The conftest's
        # pytest_sessionstart configures the Hub and installs validators when the
        # CLI is present and GUARDRAILS_API_KEY is set.
        run: |
          uv sync --group dev --all-extras

      - name: Run engine tests
        env:
          GUARDRAILS_API_KEY: ${{ secrets.GUARDRAILS_API_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
        run: |
          uv run pytest libs/idun_agent_engine/tests -m "not requires_langfuse and not requires_phoenix and not requires_postgres"

  guidelines-check:
    name: Coding guidelines drift check (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Clone idun-dev plugin
        env:
          IDUN_DEV_TOKEN: ${{ secrets.IDUN_DEV_READ_TOKEN }}
        run: |
          if [ -z "$IDUN_DEV_TOKEN" ]; then
            echo "IDUN_DEV_READ_TOKEN secret not set — cannot clone idun-dev plugin."
            echo "Add the secret to repo settings or skip the guidelines-check job."
            exit 1
          fi
          git clone --depth 1 \
            https://x-access-token:$IDUN_DEV_TOKEN@github.com/Idun-Group/idun-dev.git \
            $RUNNER_TEMP/idun-dev

      - name: Set up uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true

      - name: Install renderer deps
        run: |
          cd $RUNNER_TEMP/idun-dev/.claude/scripts
          uv sync --all-groups

      - name: Drift check
        id: drift
        run: |
          cd $RUNNER_TEMP/idun-dev/.claude/scripts
          uv run python render_guidelines.py \
            --target-repo $GITHUB_WORKSPACE --check
        continue-on-error: true

      - name: Comment on PR if drift
        if: steps.drift.outcome == 'failure' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: guidelines-drift
          message: |
            Coding-guideline outputs have drifted from the YAML source of truth.
            Run `/render-guidelines` locally and commit the resulting changes.

            (This check is **advisory** in v1 — it will not block merge.)

  # Disabled by default — set repo variable GUIDELINES_REVIEW_ENABLED=true to enable.
  #
  # When enabled, also requires the ANTHROPIC_API_KEY secret (team's Anthropic
  # console; see SPEC §4.5). The job stays SKIPPED (not failed) until the
  # variable is set, keeping the PR checks panel clean.
  #
  # To enable:
  #   1. Repo Settings → Secrets and variables → Actions → Variables tab
  #      → New repository variable: GUIDELINES_REVIEW_ENABLED = true
  #   2. Same screen, Secrets tab → New repository secret: ANTHROPIC_API_KEY
  guidelines-review:
    name: Coding-guidelines advisory review (Claude headless)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request' && vars.GUIDELINES_REVIEW_ENABLED == 'true'
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0      # full history for the diff

      - name: Capture PR diff
        run: |
          git diff origin/${{ github.base_ref }}...${{ github.event.pull_request.head.sha }} \
            --no-color > /tmp/pr.diff
          git diff origin/${{ github.base_ref }}...${{ github.event.pull_request.head.sha }} \
            --name-only > /tmp/pr.files

      - name: Verify code-reviewer agent prompt exists
        id: verify_agent
        run: |
          if [ ! -f .claude/agents/code-reviewer.md ]; then
            echo "Agent prompt missing — run /idun-team:render-guidelines and recommit." >&2
            exit 1
          fi

      - name: Run Claude code-reviewer headless
        id: review
        # Pinned to the v1 major tag (canonical floating major from the
        # action's release page). Bump deliberately when the team upgrades.
        # NOTE: anthropics/claude-code-action@v1 has no `system_prompt_file`
        # input; the agent prompt is concatenated into `prompt` instead, and
        # the action posts its own sticky PR comment via `use_sticky_comment`.
        uses: anthropics/claude-code-action@dde2242db6af13460b916652159b6ba19a598f30 # v1.0.120
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: "true"
          prompt: |
            You are the Idun "code-reviewer" subagent. Your full system prompt
            and rule set are in the file `.claude/agents/code-reviewer.md` in
            this repository — read it first and follow it exactly.

            Then read `/tmp/pr.diff` (the unified diff for this PR) and
            `/tmp/pr.files` (the list of changed files), and produce the
            markdown report described in the agent prompt's "Output format"
            section. Output ONLY the report — no preamble, no trailing chatter.

            Append this footer verbatim at the end of the report:

            ---
            _This check is **advisory** in v1. Run `/review-pr` locally to
            iterate. Findings here do not block merge._

  security-audit:
    name: Dependency vulnerability audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false

      - name: Export resolved Python requirements
        run: |
          uv export --no-dev --no-hashes --no-emit-workspace > requirements-audit.txt
          echo "Exported $(wc -l < requirements-audit.txt) locked Python dependencies."

      - name: Run pip-audit
        run: |
          uv tool run --from pip-audit pip-audit \
            --requirement requirements-audit.txt \
            --vulnerability-service osv \
            --desc on \
            --strict \
          | tee pip-audit-report.txt
          echo "::warning::See pip-audit-report.txt for Python dependency findings."

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Run pnpm audit on standalone UI
        working-directory: services/idun_agent_standalone_ui
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm audit --audit-level=high --json | tee ../../pnpm-audit-report.json || true
          echo "::warning::See pnpm-audit-report.json for npm dependency findings."

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit-reports
          path: |
            pip-audit-report.txt
            pnpm-audit-report.json
          if-no-files-found: ignore
