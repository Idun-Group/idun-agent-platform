name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint, type-check, and secrets scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run pre-commit via uv
        env:
          RUFF_CACHE_DIR: ${{ github.workspace }}/.ruff_cache
          PYRIGHT_PYTHON_FORCE_VERSION: latest
        run: |
          uv run pre-commit run --all-files

  test-engine:
    name: Test engine (Py3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Install workspace dependencies
        run: |
          uv sync --group dev

      - name: Run engine tests
        env:
          GUARDRAILS_API_KEY: ${{ secrets.GUARDRAILS_API_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
        run: |
          uv run pytest libs/idun_agent_engine/tests -m "not requires_langfuse and not requires_phoenix and not requires_postgres"

  guidelines-check:
    name: Coding guidelines drift check (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Clone idun-dev plugin
        env:
          IDUN_DEV_TOKEN: ${{ secrets.IDUN_DEV_READ_TOKEN }}
        run: |
          if [ -z "$IDUN_DEV_TOKEN" ]; then
            echo "IDUN_DEV_READ_TOKEN secret not set — cannot clone idun-dev plugin."
            echo "Add the secret to repo settings or skip the guidelines-check job."
            exit 1
          fi
          git clone --depth 1 \
            https://x-access-token:$IDUN_DEV_TOKEN@github.com/Idun-Group/idun-dev.git \
            $RUNNER_TEMP/idun-dev

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install renderer deps
        run: |
          cd $RUNNER_TEMP/idun-dev/.claude/scripts
          uv sync --all-groups

      - name: Drift check
        id: drift
        run: |
          cd $RUNNER_TEMP/idun-dev/.claude/scripts
          uv run python render_guidelines.py \
            --target-repo $GITHUB_WORKSPACE --check
        continue-on-error: true

      - name: Comment on PR if drift
        if: steps.drift.outcome == 'failure' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: guidelines-drift
          message: |
            Coding-guideline outputs have drifted from the YAML source of truth.
            Run `/render-guidelines` locally and commit the resulting changes.

            (This check is **advisory** in v1 — it will not block merge.)

  # Requires repo secrets:
  #   - ANTHROPIC_API_KEY (from team's Anthropic console; see SPEC §4.5)
  # Without the secret, the action step fails but the workflow stays green
  # via continue-on-error: true at the job level.
  guidelines-review:
    name: Coding-guidelines advisory review (Claude headless)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history for the diff

      - name: Capture PR diff
        run: |
          git diff origin/${{ github.base_ref }}...${{ github.event.pull_request.head.sha }} \
            --no-color > /tmp/pr.diff
          git diff origin/${{ github.base_ref }}...${{ github.event.pull_request.head.sha }} \
            --name-only > /tmp/pr.files

      - name: Verify code-reviewer agent prompt exists
        id: verify_agent
        run: |
          if [ ! -f .claude/agents/code-reviewer.md ]; then
            echo "Agent prompt missing — run /idun-team:render-guidelines and recommit." >&2
            exit 1
          fi

      - name: Run Claude code-reviewer headless
        id: review
        # Pinned to the v1 major tag (canonical floating major from the
        # action's release page). Bump deliberately when the team upgrades.
        # NOTE: anthropics/claude-code-action@v1 has no `system_prompt_file`
        # input; the agent prompt is concatenated into `prompt` instead, and
        # the action posts its own sticky PR comment via `use_sticky_comment`.
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: "true"
          prompt: |
            You are the Idun "code-reviewer" subagent. Your full system prompt
            and rule set are in the file `.claude/agents/code-reviewer.md` in
            this repository — read it first and follow it exactly.

            Then read `/tmp/pr.diff` (the unified diff for this PR) and
            `/tmp/pr.files` (the list of changed files), and produce the
            markdown report described in the agent prompt's "Output format"
            section. Output ONLY the report — no preamble, no trailing chatter.

            Append this footer verbatim at the end of the report:

            ---
            _This check is **advisory** in v1. Run `/review-pr` locally to
            iterate. Findings here do not block merge._
