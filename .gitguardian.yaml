version: 2

# GitGuardian config. The platform repository contains a few
# intentionally-public throwaway credentials in test/CI surfaces. Real
# secrets do not live in version control.

secret:
  # Path-scoped allowlist: the standalone CI workflow stands up a
  # ``postgres:16`` service container in the GitHub Actions runner and
  # passes its credentials through to the pytest job via
  # ``STANDALONE_TEST_POSTGRES_URL``. The password is the literal string
  # used by the service container's ``POSTGRES_PASSWORD`` env, scoped to
  # an ephemeral Docker network on the runner itself, and is never
  # reachable from outside that VM. Same fixture appears in the
  # `tests/integration/db/test_trace_*` files.
  ignored-paths:
    - .github/workflows/standalone-ci.yml

  # Any literal that may turn up across other test/CI surfaces with the
  # same throwaway credential pattern. Add new entries explicitly so a
  # real secret cannot regress past the scanner.
  ignored-matches:
    - name: "Postgres test credentials in CI service container"
      match: "postgresql+asyncpg://idun:idun@localhost:5432/idun_test"
