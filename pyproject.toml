[project]
name = "idun-engine"
version = "0.6.0"
description = "Idun Engine"
authors = [{ name = "Idun Group", email = "h.geoffrey@idun-group.com" }]
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "GPL-3.0-only"
dependencies = [
    "idun-agent-engine>=0.6.0,<0.7.0",
    "idun-agent-schema>=0.6.0,<0.7.0",
    "idun-agent-standalone",
]

[dependency-groups]
dev = [
    "ruff>=0.6.5,<0.7",
    "pre-commit>=3.8.0,<4",
    "mypy>=1.10.0,<2",
    "pytest>=8.3.3,<9",
    "pytest-cov>=5.0.0,<6",
    "types-PyYAML>=6.0.12.20240808,<7",
    "pyright>=1.1.404,<2",
    "pytest-asyncio>=1.3.0",
    "typer>=0.15.0",
    "langchain-openai>=0.3.0",
]

[tool.uv]
package = false

# Declare the three Idun libs as a uv workspace so `uv build --package
# idun-agent-standalone` works from the repo root and resolves the
# inter-lib editable installs by name.
[tool.uv.workspace]
members = [
    "libs/idun_agent_engine",
    "libs/idun_agent_schema",
    "libs/idun_agent_standalone",
]

[tool.uv.sources]
idun-agent-engine = { workspace = true }
idun-agent-schema = { workspace = true }
idun-agent-standalone = { workspace = true }
# Temporary workaround: the PyPI ``guardrails-ai`` project was quarantined for
# a security incident, so the published 0.9.2 wheel is no longer resolvable.
# Point uv at the upstream git tag so ``uv lock`` / ``uv sync`` succeed for the
# optional ``[guardrails]`` extra of idun-agent-engine. Source overrides apply
# only to local resolution — published engine wheels still reference
# ``guardrails-ai==0.9.2`` on PyPI, so end-users are unaffected once upstream
# restores the project. Remove this entry when that happens.
guardrails-ai = { git = "https://github.com/guardrails-ai/guardrails", tag = "v0.9.2" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
