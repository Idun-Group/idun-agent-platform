[project]
name = "idun-engine"
version = "0.6.0"
description = "Idun Engine"
authors = [{ name = "Idun Group", email = "h.geoffrey@idun-group.com" }]
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "GPL-3.0-only"
dependencies = [
    "cryptography>=46.0.3",
    "idun-agent-engine>=0.6.0,<0.7.0",
    "idun-agent-schema>=0.6.0,<0.7.0",
    "idun-agent-standalone",
]

[dependency-groups]
dev = [
    "ruff>=0.6.5,<0.7",
    "black>=24.8.0,<27",
    "pre-commit>=3.8.0,<4",
    "mypy>=1.10.0,<2",
    "pytest>=8.3.3,<9",
    "pytest-cov>=5.0.0,<6",
    "types-PyYAML>=6.0.12.20240808,<7",
    "pyright>=1.1.404,<2",
    "torch>=2.10.0",
    "pytest-asyncio>=1.3.0",
    "typer>=0.15.0",
]

[tool.uv]
package = false

# Declare the three Idun libs as a uv workspace so `uv build --package
# idun-agent-standalone` works from the repo root and resolves the
# inter-lib editable installs by name.
[tool.uv.workspace]
members = [
    "libs/idun_agent_engine",
    "libs/idun_agent_schema",
    "libs/idun_agent_standalone",
]

[tool.uv.sources]
idun-agent-engine = { workspace = true }
idun-agent-schema = { workspace = true }
idun-agent-standalone = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
