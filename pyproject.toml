[project]
name = "idun-engine"
version = "0.6.0"
description = "Idun Engine"
authors = [{ name = "Idun Group", email = "h.geoffrey@idun-group.com" }]
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "GPL-3.0-only"
dependencies = [
    "idun-agent-engine>=0.6.0,<0.7.0",
    "idun-agent-schema>=0.6.0,<0.7.0",
    "idun-agent-standalone",
]

[dependency-groups]
dev = [
    "ruff>=0.6.5,<0.7",
    "pre-commit>=3.8.0,<4",
    "mypy>=1.10.0,<2",
    "pytest>=8.3.3,<9",
    "pytest-cov>=5.0.0,<6",
    "types-PyYAML>=6.0.12.20240808,<7",
    "pyright>=1.1.404,<2",
    "pytest-asyncio>=1.3.0",
    "typer>=0.15.0",
    "langchain-openai>=0.3.0",
]

[tool.uv]
package = false

# PyPI quarantined guardrails-ai's simple index on 2026-05-12 due to a
# security issue (guardrails-ai/guardrails#1473). The wheel CDN URLs
# remain live, but any workspace `uv lock` re-resolves all packages
# and fails on the empty simple index. Restricting to the platforms we
# actually ship (macOS dev + Linux Cloud Run) avoids the win32 resolver
# split that triggers the failure most loudly. Combined with the
# explicit guardrails-ai URL override in [tool.uv.sources] below, this
# restores lock-ability. Remove both once the quarantine lifts.
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

# Declare the three Idun libs as a uv workspace so `uv build --package
# idun-agent-standalone` works from the repo root and resolves the
# inter-lib editable installs by name.
[tool.uv.workspace]
members = [
    "libs/idun_agent_engine",
    "libs/idun_agent_schema",
    "libs/idun_agent_standalone",
]

[tool.uv.sources]
idun-agent-engine = { workspace = true }
idun-agent-schema = { workspace = true }
idun-agent-standalone = { workspace = true }
# Quarantine workaround (see [tool.uv] comment). Wheel URL still served
# from the CDN even though PyPI's simple index returns no files.
guardrails-ai = { url = "https://files.pythonhosted.org/packages/cf/67/b1db74bf7bd6cbbdd5e6f37880ece08e9d6a785cf955c8ba652ed43ec880/guardrails_ai-0.9.2-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
